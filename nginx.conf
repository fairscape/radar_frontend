# Minimal nginx config for the radar SPA.
#
# - listens on 5173 to match the dev-server port the rest of the docs use,
#   so VITE_API_BASE_URL=http://localhost:8000 works the same in dev and
#   docker-compose without juggling two ports.
# - SPA fallback to /index.html so deep-link refreshes (e.g.
#   /profiles/neonatal_vitals) don't 404.
# - no /api proxy — the browser hits the backend on the host port directly
#   (compose publishes :8000), backend CORS allows http://localhost:5173.

server {
    listen       5173;
    listen       [::]:5173;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Permissive CORS for local testing — every response gets allow-*
    # headers, and OPTIONS preflights short-circuit with 204. Tighten
    # before exposing this server publicly.
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-User-Email, X-Requested-With" always;
    add_header Access-Control-Expose-Headers "*" always;

    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-User-Email, X-Requested-With" always;
        add_header Access-Control-Max-Age      "86400" always;
        add_header Content-Length              0;
        add_header Content-Type                "text/plain";
        return 204;
    }

    # Long cache for hashed assets, no cache for the entry document so
    # deploys are picked up without a hard refresh.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # gzip on the SPA bundle.
    gzip               on;
    gzip_types         text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length    1024;
}
